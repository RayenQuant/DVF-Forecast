[project]
name = "dvf-forecast"
version = "1.0.0"
description = "Prévision de prix immobiliers à partir des données DVF (data.gouv.fr)"
authors = [{ name = "Rayen Aissa" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # ligne trop longue (géré par black)
    "B008",  # function-call-in-default-argument (faux positifs sur Path)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
